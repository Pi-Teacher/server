name: Docker Image Build

# 手动触发: 取仓库中最新的 tag, 检出该 tag 的 commit 构建多架构镜像,
# 推送到 GitHub 容器镜像仓库 (ghcr.io/<owner>/server).
# 每次执行都额外打上 latest, 因此 latest 始终等于最近一次构建的镜像.
on:
  workflow_dispatch:

permissions:
  contents: read
  # 推送镜像到 ghcr.io 需要写权限; GITHUB_TOKEN 即可, 无需额外密钥.
  packages: write

env:
  # ghcr 要求仓库路径全小写, metadata-action 会把 owner 自动转为小写.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库 (含全部 tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与二进制发布保持一致: 版本与源码都取自最新 tag, 不受默认分支后续提交影响.
      - name: 解析最新 tag 并检出其 commit
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="$(git tag --sort=-v:refname | head -n1)"
          if [ -z "$TAG" ]; then
            echo "::error::仓库中没有任何 tag, 无法确定发布版本"
            exit 1
          fi
          echo "使用最新 tag: $TAG"
          git checkout "$TAG"
          echo "检出 commit: $(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # linux/arm64 的最终镜像里仍有少量 RUN (apk 安装证书与时区),
      # 需要 QEMU 才能在 amd64 构建机上执行; Go 编译本身是交叉编译, 不走模拟.
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
